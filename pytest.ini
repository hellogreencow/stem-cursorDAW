[pytest]
testpaths = tests
markers =
    live: requires a running Ardour instance with Stem bridge (skip in PR CI)
    nightly: slower or external; not part of the default PR gate
    slow: long-running soak / fuzz
    generation: audio generation backends / cassettes
    dogfood: end-to-end producer recipes
filterwarnings =
    ignore::DeprecationWarning
